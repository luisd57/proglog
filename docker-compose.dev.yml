name: proglog-dev

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/proglog.db
    volumes:
      - ./api:/app
      - /app/node_modules
      - ./data:/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
